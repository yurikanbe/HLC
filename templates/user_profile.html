<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザープロフィール - japanft</title>
  <meta name="description" content="ユーザープロフィール">
  <link rel="icon" href="/static/img/halcoin.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/profile.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="nav">
        <div class="brand">
          <div class="brand-badge"></div>
          <a href="/">japanft</a>
        </div>
        <div class="nav-actions">
          <a class="btn" href="/">ホーム</a>
          <a class="btn" href="/purchases">購入履歴</a>
          <a class="btn" href="/cart">🛒 カート <span class="cart-count" id="cartCount">0</span></a>
          <a class="btn" href="/chat">💬 チャット</a>
          <a class="btn" href="/mining">⚒️ マイニング</a>
          <a class="btn" href="/profile">👤 プロフィール</a>
          <a class="btn" href="/login">ログイン</a>
          <a class="btn" href="/signup">アカウント作成</a>
        </div>
      </div>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 id="userName">ユーザープロフィール</h1>
      <p class="muted" id="userTag"></p>
    </section>

    <section class="section">
      <h2>基本情報</h2>
      <div class="row">
        <div class="input input-min-width-240" id="displayName" style="background: var(--bg-secondary); border: 1px solid var(--border); padding: 10px; border-radius: 8px;" readonly></div>
        <div class="input input-min-width-320" id="userType" style="background: var(--bg-secondary); border: 1px solid var(--border); padding: 10px; border-radius: 8px;"></div>
      </div>
    </section>

    <section class="section">
      <h2>自己紹介</h2>
      <div class="input input-full" id="bio" style="background: var(--bg-secondary); border: 1px solid var(--border); padding: 10px; border-radius: 8px; min-height: 80px;" readonly></div>
    </section>

    <section class="section">
      <h2>出品一覧</h2>
      <div id="listings" class="grid"></div>
      <p id="emptyMsg" class="empty" hidden>まだ出品がありません。</p>
    </section>
  </main>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/user_profile.js"></script>
</body>
</html>
