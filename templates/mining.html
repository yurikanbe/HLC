<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイニング - japanft</title>
  <meta name="description" content="マイニングの開始・停止と統計">
  <link rel="icon" href="/static/img/halcoin.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/mining.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="nav">
        <div class="brand">
          <div class="brand-badge"></div>
          <a href="/">japanft</a>
        </div>
        <div class="nav-actions">
          <a class="btn" href="/">ホーム</a>
          <a class="btn" href="/purchases">購入履歴</a>
          <a class="btn" href="/cart">🛒 カート <span class="cart-count" id="cartCount">0</span></a>
          <a class="btn" href="/chat">💬 チャット</a>
          <a class="btn" href="/mining">⚒️ マイニング</a>
          <a class="btn" href="/transfer">💰 送金</a>
          <a class="btn" href="/tutorial">📖 使い方</a>
          <a class="btn" href="/login">ログイン</a>
          <a class="btn" href="/signup">アカウント作成</a>
        </div>
      </div>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>マイニング</h1>
      <p>開始/停止、ハッシュレート、報酬を確認できます。</p>
    </section>

    <section class="panel">
      <div class="row">
        <button id="toggle" class="btn primary" type="button">開始</button>
        <button id="reset" class="btn" type="button">統計をリセット</button>
      </div>

      <div class="stat-grid">
        <div class="stat"><div class="label">ハッシュレート</div><div class="value" id="rate">0 H/s</div></div>
        <div class="stat"><div class="label">累計マイニング</div><div class="value" id="found">0</div></div>
        <div class="stat"><div class="label">報酬合計</div><div class="value"><span>HLC</span><span id="reward">0.00</span></div></div>
      </div>

      <div class="log" id="log"></div>
    </section>
  </main>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/mining.js"></script>
</body>
</html>
