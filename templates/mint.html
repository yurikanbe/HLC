<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFTミント管理 - japanft</title>
  <meta name="description" content="NFTのミント状態を管理">
  <link rel="icon" href="/static/img/halcoin.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/product.css">
  <style>
    .mint-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: 500;
    }
    .mint-status.minted {
      background: rgba(0, 225, 160, 0.2);
      color: var(--accent-2);
      border: 1px solid var(--accent-2);
    }
    .mint-status.not-minted {
      background: rgba(139, 152, 165, 0.2);
      color: var(--muted);
      border: 1px solid var(--muted);
    }
    .mint-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .filter-tab {
      padding: 8px 16px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .filter-tab:hover {
      color: var(--fg);
    }
    .filter-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .nft-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }
    .nft-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .nft-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .nft-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }
    .nft-info {
      padding: 16px;
    }
    .nft-name {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .nft-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .blockchain-hash {
      font-size: 0.75em;
      color: var(--muted);
      word-break: break-all;
      margin-top: 8px;
      font-family: monospace;
    }
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="nav">
        <div class="brand">
          <div class="brand-badge"></div>
          <a href="/">japanft</a>
        </div>
        <div class="nav-actions">
          <a class="btn" href="/">ホーム</a>
          <a class="btn" href="/purchases">購入履歴</a>
          <a class="btn" href="/cart">🛒 カート <span class="cart-count" id="cartCount">0</span></a>
          <a class="btn" href="/create">🎨 出品</a>
          <a class="btn" href="/mint">🔗 ミント管理</a>
          <a class="btn" href="/transfer">💰 送金</a>
          <a class="btn" href="/profile">👤 プロフィール</a>
        </div>
      </div>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>NFTミント管理</h1>
      <p class="muted">あなたのNFTのミント状態を確認・管理できます。</p>
    </section>

    <section class="card">
      <div class="content">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">すべて</button>
          <button class="filter-tab" data-filter="minted">ミント済み</button>
          <button class="filter-tab" data-filter="not-minted">未ミント</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
          読み込み中...
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
          <p>NFTが見つかりませんでした。</p>
        </div>

        <div id="nftGrid" class="nft-grid"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="/static/js/auth.js"></script>
  <script>
    // ページ読み込み前に即座にログインチェック
    (function() {
      const token = localStorage.getItem("japanft_token");
      if (!token) {
        console.log("No token found, redirecting to login");
        window.location.replace("/login");
        return;
      }
    })();
  </script>
  <script src="/static/js/mint.js"></script>
</body>
</html>
